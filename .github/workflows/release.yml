name: Release

# Pushing a tag vMAJOR.MINOR.PATCH publishes a GitHub release. The workflow
# checks the tag against version.hpp and CHANGELOG.md, runs every CI job on
# the tagged commit, and then attaches a source archive, its SHA-256 checksum,
# and a build provenance attestation. CONTRIBUTING.md describes the procedure.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Write the notes and the source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          git archive --format=tar.gz --prefix="scrydantic-${version}/" \
            --output="dist/scrydantic-${version}.tar.gz" HEAD
          (cd dist && sha256sum "scrydantic-${version}.tar.gz" > "scrydantic-${version}.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --title "Scrydantic ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
