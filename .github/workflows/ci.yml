name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Ubuntu 24.04 ships LLVM 18, which formats reflection annotations
      # differently and cannot parse libstdc++'s <expected>, so both tools come
      # from apt.llvm.org.
      # clang-tidy reads the libstdc++ headers of the newest GCC that it finds.
      # g++-14 makes sure that the headers of that GCC are installed.
      - name: Install clang-format and clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22 clang-tidy-22 g++-14
      - run: ./scripts/format.sh --check
        env:
          CLANG_FORMAT: clang-format-22
      - run: ./scripts/lint.sh
        env:
          CLANG_TIDY: clang-tidy-22

  test:
    name: test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC 16
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y g++-16 ninja-build
          # High-entropy ASLR breaks ASan/TSan shadow memory on these runners.
          sudo sysctl vm.mmap_rnd_bits=28
      - run: ./scripts/test.sh
        env:
          PRESET: ${{ matrix.preset }}

  # Install the package without tests or examples, then build and run a
  # consumer that knows only find_package(scrydantic).
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC 16
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y g++-16 ninja-build
      - name: Build and install
        run: |
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DSCRYDANTIC_BUILD_TESTS=OFF -DSCRYDANTIC_BUILD_EXAMPLES=OFF
          cmake --build build/package
          cmake --install build/package --prefix "${RUNNER_TEMP}/stage"
      - name: Build and run the consumer
        run: |
          cmake -S tests/package -B build/consumer -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/stage"
          cmake --build build/consumer
          build/consumer/scrydantic_package_consumer
