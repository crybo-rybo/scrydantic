name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicitly bash, so every step also runs with -o pipefail.
    shell: bash

jobs:
  # The scripts run the pinned clang-format, clang-tidy, shellcheck, and lizard
  # (scripts/lib/tools.sh) through pipx, which the runner image provides.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # clang-tidy reads the libstdc++ headers of the newest GCC it finds;
      # g++-14 makes sure they include <expected> and <print>.
      - run: sudo apt-get update && sudo apt-get install -y g++-14
      - run: ./scripts/format.sh --check
      - run: ./scripts/lint.sh

  test:
    name: test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gcc16
      - run: ./scripts/test.sh
        env:
          PRESET: ${{ matrix.preset }}
          CXX: g++-16

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gcc16
      - run: ./scripts/coverage.sh | tee coverage.txt
        env:
          CXX: g++-16
      - name: Summarize
        run: |
          {
            echo '## Line coverage of include/ and src/'
            echo '```'
            sed -n '/GCC Code Coverage Report/,$p' coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # Install the package without tests or examples, then build and run a
  # consumer that knows only find_package(scrydantic).
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gcc16
      - name: Build and install
        run: |
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DSCRYDANTIC_BUILD_TESTS=OFF -DSCRYDANTIC_BUILD_EXAMPLES=OFF
          cmake --build build/package
          cmake --install build/package --prefix "${RUNNER_TEMP}/stage"
      - name: Build and run the consumer
        run: |
          cmake -S tests/package -B build/consumer -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/stage"
          cmake --build build/consumer
          build/consumer/scrydantic_package_consumer
