name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow (release.yml) runs every job here on the tag first.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicitly bash, so every step also runs with -o pipefail.
    shell: bash

jobs:
  # The scripts run the pinned clang-format, clang-tidy, shellcheck, and lizard
  # (scripts/lib/tools.sh) through pipx, which the runner image provides.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # clang-tidy reads the libstdc++ headers of the newest GCC it finds;
      # g++-14 makes sure they include <expected> and <print>.
      - run: sudo apt-get update && sudo apt-get install -y g++-14
      - run: ./scripts/format.sh --check
      - run: ./scripts/lint.sh

  # The jobs that compile Scrydantic run in the official GCC image, pinned by
  # digest, so CI builds with the released compiler that users have. Ubuntu
  # and its toolchain PPA package only development snapshots of GCC 16. To
  # update GCC, change the tag and the digest here; the other jobs reuse it.
  #
  # No plain dev job: asan, tsan, and coverage each inherit the dev preset (a
  # Debug build with libstdc++ assertions) and run every test, so a dev job
  # would only repeat one of their builds without the instrumentation.
  test:
    name: test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan, tsan]
        include:
          # The runners' high-entropy ASLR gives TSan a memory layout it
          # cannot use, so TSan disables ASLR and runs itself again. Docker's
          # default seccomp profile forbids that personality() call.
          - preset: tsan
            container-options: --security-opt seccomp=unconfined
    runs-on: ubuntu-24.04
    container:
      image: &gcc-image gcc:16.2.0@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
      options: ${{ matrix.container-options }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build-tools
      - run: ./scripts/test.sh
        env:
          PRESET: ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    container:
      image: *gcc-image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build-tools
        with:
          packages: pipx
      - run: ./scripts/coverage.sh | tee coverage.txt
      - name: Summarize
        run: |
          {
            echo '## Line coverage of include/ and src/'
            echo '```'
            sed -n '/GCC Code Coverage Report/,$p' coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # Build and run a consumer that knows only find_package(scrydantic) against
  # the installed package (without tests or examples), and the same consumer
  # with Scrydantic as a subdirectory, as FetchContent adds it.
  package:
    name: package (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [install, subdirectory]
    runs-on: ubuntu-24.04
    container:
      image: *gcc-image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build-tools
      - name: Build and install
        if: matrix.mode == 'install'
        run: |
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSCRYDANTIC_BUILD_TESTS=OFF -DSCRYDANTIC_BUILD_EXAMPLES=OFF
          cmake --build build/package
          cmake --install build/package --prefix "${RUNNER_TEMP}/stage"
          echo "CONSUMER_ARGS=-DCMAKE_PREFIX_PATH=${RUNNER_TEMP}/stage" >> "${GITHUB_ENV}"
      - name: Use the source tree
        if: matrix.mode == 'subdirectory'
        run: echo "CONSUMER_ARGS=-DSCRYDANTIC_SOURCE_DIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
      - name: Build and run the consumer
        run: |
          cmake -S tests/package -B build/consumer -G Ninja "${CONSUMER_ARGS}"
          cmake --build build/consumer
          build/consumer/scrydantic_package_consumer
