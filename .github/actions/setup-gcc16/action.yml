name: Set up GCC 16
description: Install GCC 16 and Ninja from the Ubuntu toolchain PPA.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
        sudo apt-get install -y g++-16 ninja-build
        # High-entropy ASLR breaks ASan/TSan shadow memory on these runners.
        sudo sysctl vm.mmap_rnd_bits=28
