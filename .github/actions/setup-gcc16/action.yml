name: Set up GCC 16
description: Install GCC 16 and Ninja from the Ubuntu toolchain PPA.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Add the PPA directly instead of with add-apt-repository, which asks
        # the Launchpad API for the signing key and fails every job whenever
        # that API is down. The key is checked in next to this file
        # (fingerprint 60C317803A41BA51845E371A1E9377A2BA9EF27F), so only the
        # package archive has to answer.
        sudo install -D -m 644 "${GITHUB_ACTION_PATH}/ubuntu-toolchain-r.asc" \
          /etc/apt/keyrings/ubuntu-toolchain-r.asc
        sudo tee /etc/apt/sources.list.d/ubuntu-toolchain-r-test.sources >/dev/null <<EOF
        Types: deb
        URIs: https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu
        Suites: $(. /etc/os-release && echo "${VERSION_CODENAME}")
        Components: main
        Signed-By: /etc/apt/keyrings/ubuntu-toolchain-r.asc
        EOF
        sudo apt-get update -o Acquire::Retries=5
        sudo apt-get install -y -o Acquire::Retries=5 g++-16 ninja-build
        # High-entropy ASLR breaks ASan/TSan shadow memory on these runners.
        sudo sysctl vm.mmap_rnd_bits=28
